name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21 (Required for Capacitor 7 & Gradle 8+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate Project Scaffold (Vite + Tailwind + Capacitor)
        run: |
          mkdir -p src
          if [ -f "App.jsx" ]; then
            cp App.jsx src/App.jsx
          fi

          cat << 'EOF' > package.json
          {
            "name": "clinidiet-rx",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build"
            },
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/cli": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "lucide-react": "^0.460.0",
              "react": "^18.3.1",
              "react-dom": "^18.3.1"
            },
            "devDependencies": {
              "@vitejs/plugin-react": "^4.3.4",
              "autoprefixer": "^10.4.20",
              "postcss": "^8.4.49",
              "tailwindcss": "^3.4.17",
              "vite": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > vite.config.js
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';

          export default defineConfig({
            plugins: [react()],
          });
          EOF

          cat << 'EOF' > tailwind.config.js
          export default {
            content: ["./index.html", "./src/**/*.{js,ts,jsx,tsx}"],
            theme: { extend: {} },
            plugins: [],
          };
          EOF

          cat << 'EOF' > postcss.config.js
          export default {
            plugins: {
              tailwindcss: {},
              autoprefixer: {},
            },
          };
          EOF

          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>CliniDiet Rx</title>
            </head>
            <body class="bg-slate-950 text-slate-100">
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF

          cat << 'EOF' > src/index.css
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          EOF

          cat << 'EOF' > src/main.jsx
          import React from 'react';
          import ReactDOM from 'react-dom/client';
          import App from './App.jsx';
          import './index.css';

          ReactDOM.createRoot(document.getElementById('root')).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>
          );
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.clinidiet.rx",
            "appName": "CliniDiet Rx",
            "webDir": "dist"
          }
          EOF

      - name: Install Dependencies & Build Offline Web Bundle
        run: |
          npm install
          npm run build

      - name: Wrap with Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compile Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CliniDiet-Rx-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
